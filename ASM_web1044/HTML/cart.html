<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ hàng - MWC Shop</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <!-- File CSS dùng chung nếu có -->
    <link rel="stylesheet" href="../css/cart.css" />
  </head>
  <body>
    <!-- HEADER -->
    <!-- 1. HEADER -->
    <header class="site-header">
      <div class="header-container container">
        <a href="index.html">
          <img src="../IMG/logo.png" class="logo" alt="Logo MWC" />
        </a>
        <!-- Menu liên kết nhanh đến từng danh mục -->
        <nav class="main-nav">
          <ul>
            <li class="has-dropdown">
              <a href="#caogot">GIÀY CAO GÓT</a>
            </li>
            <li class="has-dropdown">
              <a href="#sandal-nu">GIÀY NỮ</a>
            </li>
            <li><a href="#charm">DÉP CHARM</a></li>
            <li><a href="#sandal-nam">GIÀY NAM</a></li>
            <li><a href="#balo">BALO - TÚI</a></li>
            <li><a href="#banchay">BÁN CHẠY</a></li>
          </ul>
        </nav>

        <div class="header-right">
          <div class="search-box">
            <input
              type="text"
              id="search-input"
              placeholder="Tìm kiếm sản phẩm..."
              autocomplete="off"
            />
            <button type="button" id="btn-search" title="Tìm kiếm">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <!-- Hộp gợi ý kết quả tìm kiếm nhanh -->
            <div class="search-dropdown" id="search-dropdown" hidden></div>
          </div>
          <a href="account.html" class="user-icon" title="Tài khoản"
            ><i class="fa-regular fa-user"></i
          ></a>
          <!-- Biểu tượng giỏ hàng & Số lượng cập nhật từ JS -->
          <a href="cart.html" class="cart-icon" title="Giỏ hàng">
            <i class="fa-solid fa-bag-shopping"></i>
            <span class="cart-badge" id="cart-count">0</span>
          </a>
        </div>
      </div>
    </header>
    <!-- BREADCRUMB -->
    <div class="breadcrumb-container">
      <a href="index.html">Trang chủ</a> <span>|</span> <span class="current">Giỏ hàng</span>
    </div>

    <!-- MAIN CART CONTENT -->
    <main class="cart-main-container">
      <!-- BANG DANH SACH SAN PHAM -->
      <div class="cart-table-wrapper">
        <table class="cart-table">
          <thead>
            <tr>
              <th class="col-product">Sản Phẩm</th>
              <th class="col-price">Đơn Giá</th>
              <th class="col-qty">Số Lượng</th>
              <th class="col-total">Số Tiền</th>
              <th class="col-action">Thao Tác</th>
            </tr>
          </thead>
          <tbody id="cart-table-body">
            <!-- JS sẽ render sản phẩm vào đây -->
          </tbody>
        </table>
      </div>

      <!-- TONG TIEN & THANH TOAN -->
      <div class="cart-summary-section">
        <div class="summary-row">
          <span>Tổng tiền hàng</span>
          <span id="summary-subtotal">0 đ</span>
        </div>
        <div class="summary-row">
          <span>Giảm giá sản phẩm</span>
          <span>- 0 đ</span>
        </div>
        <div class="summary-row">
          <span>Giảm giá coupon</span>
          <span>- 0 đ</span>
        </div>
        <div class="summary-row">
          <span>Phí vận chuyển</span>
          <span>0 đ</span>
        </div>
        <div class="summary-row summary-total">
          <span>TỔNG</span>
          <span id="summary-grandtotal" class="total-price">0 đ</span>
        </div>
      </div>

      <!-- THONG TIN VAN CHUYEN (FORM MUA HANG) -->
      <section class="shipping-section">
        <h3 class="shipping-title">THÔNG TIN VẬN CHUYỂN</h3>
        <form id="checkout-form" onsubmit="handleCheckout(event)">
          <div class="form-row flex-2">
            <input type="text" id="fullname" placeholder="Họ tên" required />
            <input
              type="tel"
              id="phone"
              placeholder="SĐT"
              pattern="[0-9]{10}"
              title="Số điện thoại gồm 10 chữ số"
              required
            />
          </div>
          <div class="form-row">
            <input type="text" id="address" placeholder="Địa chỉ nhận hàng" required />
          </div>
          <div class="form-row flex-3">
            <select id="province" required>
              <option value="">-- Chọn tỉnh --</option>
              <option value="HCM">Thành phố Hồ Chí Minh</option>
              <option value="HN">Hà Nội</option>
              <option value="DN">Đà Nẵng</option>
              <option value="BD">Bình Dương</option>
              <option value="ĐN">Đồng Nai</option>
            </select>
            <select id="district" required>
              <option value="">--Chọn Quận/huyện--</option>
              <option value="Q1">Quận 1</option>
              <option value="Q3">Quận 3</option>
              <option value="Q7">Quận 7</option>
              <option value="Q10">Quận 10</option>
              <option value="TPTD">TP. Thủ Đức</option>
            </select>
            <select id="ward" required>
              <option value="">--Chọn Xã/Phường--</option>
              <option value="P1">Phường 1</option>
              <option value="P2">Phường 2</option>
              <option value="P5">Phường 5</option>
              <option value="P12">Phường 12</option>
            </select>
          </div>

          <div class="form-submit-wrapper">
            <button type="submit" class="btn-order">Đặt Hàng</button>
          </div>
        </form>
      </section>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
